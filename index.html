<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bizilytics Battle – DoMS, Anna University</title>
<style>
:root{--bg:#f0f4ff;--card:#fff;--tx:#0b1533;--mut:#5a6787;--bd:#dde3f4;--pri:#2563eb;--sec:#7c3aed;--acc:#0891b2;--up:#059669;--dn:#dc2626;--nav:#1e293b;--warn:#d97706;--gold:#f59e0b}
:root[data-theme=dark]{--bg:#0d1117;--card:#161b2e;--tx:#e2e8f8;--mut:#8b97bb;--bd:#243050;--pri:#60a5fa;--sec:#a78bfa;--acc:#22d3ee;--up:#34d399;--dn:#f87171;--nav:#0a0f1e;--warn:#fbbf24;--gold:#fbbf24}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,'Segoe UI',Arial;background:var(--bg);color:var(--tx)}
header{background:var(--nav);color:#fff;padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .brand{font-size:20px;font-weight:800;letter-spacing:.04em;color:#fff}header .brand span{color:var(--gold)}
header .sp{flex:1}
.pill{background:#ffffff22;padding:3px 10px;border-radius:99px;font-size:12px}
.pill.accent{background:var(--pri);color:#fff;font-weight:700}
.pill.warn{background:var(--warn);color:#000;font-weight:700}
main{padding:14px;max-width:1400px;margin:auto}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
@media(max-width:800px){.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;overflow:auto}
h2{margin:0 0 12px;font-size:16px;font-weight:700}h3{margin:0 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:22px;margin-top:4px}.up{color:var(--up)}.dn{color:var(--dn)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}th{color:var(--mut);font-weight:600}
tr:hover td{background:var(--bg)}
input,select,textarea{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin:3px 0 8px}
textarea{resize:vertical;min-height:80px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:0;cursor:pointer;font-weight:600;transition:opacity .15s}
button.pri{background:var(--pri);color:#fff}button.sec{background:var(--sec);color:#fff}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.r{background:var(--dn);color:#fff}button.s{background:var(--up);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{width:auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--bd);margin-bottom:12px}
.tabs button{background:transparent;color:var(--mut);border:0;border-bottom:3px solid transparent;border-radius:0;margin-bottom:-2px;padding:8px 14px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
.land{max-width:480px;margin:6vh auto;text-align:center}
.land .logo{font-size:48px;font-weight:900;letter-spacing:.06em;color:var(--pri)}.land .logo span{color:var(--sec)}
.land .tag{font-size:15px;color:var(--mut);margin:4px 0 24px}.land .card{text-align:left}
.err{color:var(--dn);min-height:18px;font-size:13px;margin:4px 0}
#toast{position:fixed;right:16px;bottom:16px;background:var(--nav);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:999;max-width:80vw;font-size:14px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:990;padding:12px}
.modal .card{max-width:520px;width:100%}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.badge.open{background:#dcfce7;color:#166534}.badge.closed{background:#fee2e2;color:#991b1b}
.badge.idle{background:#f1f5f9;color:#475569}.badge.ended{background:#fef9c3;color:#854d0e}
.wm{text-align:center;color:var(--mut);font-size:11px;padding:16px}
/* Round status banner */
.status-bar{padding:10px 18px;font-weight:700;font-size:14px;text-align:center}
.status-bar.idle{background:#1e293b;color:#94a3b8}
.status-bar.r1_open{background:#166534;color:#dcfce7}
.status-bar.r1_closed{background:#78350f;color:#fef3c7}
.status-bar.r2_open{background:#1e40af;color:#dbeafe}
.status-bar.r2_closed{background:#5b21b6;color:#ede9fe}
.status-bar.r3_open{background:#0e7490;color:#cffafe}
.status-bar.r3_closed{background:#713f12;color:#fef9c3}
.status-bar.ended{background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff}
/* Quiz styles */
.qcard{border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px;transition:border-color .2s}
.qcard.answered{border-color:var(--pri)}
.qcard .qnum{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:6px}
.qcard .qtext{font-weight:600;margin-bottom:10px;line-height:1.4}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.options{grid-template-columns:1fr}}
.opt{padding:10px 14px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;text-align:left;font:inherit;background:var(--card);color:var(--tx);transition:all .15s}
.opt:hover{border-color:var(--pri);background:var(--bg)}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card));font-weight:600}
.opt.correct{border-color:var(--up);background:color-mix(in srgb,var(--up) 12%,var(--card))}
.opt.wrong{border-color:var(--dn);background:color-mix(in srgb,var(--dn) 12%,var(--card))}
/* Timer */
.timer-ring{text-align:center;padding:12px}.timer-big{font-size:48px;font-weight:900;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1}
.timer-big.warn{color:var(--warn)}.timer-big.danger{color:var(--dn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
/* Case / scenario */
.case-block{background:var(--bg);border-radius:10px;padding:14px;margin:8px 0;line-height:1.6}
.case-block pre{white-space:pre-wrap;font:inherit;margin:0}
.data-chip{display:inline-block;padding:4px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);font-size:12px;margin:2px}
/* Leaderboard */
.lb-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;margin-bottom:6px;background:var(--bg)}
.lb-row.top1{background:linear-gradient(90deg,#fef9c3,var(--bg));border-left:4px solid var(--gold)}
.lb-row.top2{background:linear-gradient(90deg,#f1f5f9,var(--bg));border-left:4px solid #94a3b8}
.lb-row.top3{background:linear-gradient(90deg,#fff7ed,var(--bg));border-left:4px solid #d97706}
.lb-rank{font-size:22px;font-weight:900;width:40px;text-align:center}
.lb-name{flex:1;font-weight:700}.lb-score{font-size:18px;font-weight:800;color:var(--pri)}
/* Score input */
.score-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.score-row label{flex:1;font-size:13px}.score-row input[type=number]{width:80px;text-align:right}
.score-max{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="/static/app.js"></script>
<script>boot()</script>
</body>
</html>
